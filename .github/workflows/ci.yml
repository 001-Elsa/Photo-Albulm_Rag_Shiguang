name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: coverage run -m pytest tests/ -q && coverage report
      - name: Ruff
        run: ruff check shiguang eval scripts tests run.py
      - name: Mypy
        run: mypy shiguang --ignore-missing-imports
      - name: API smoke test
        env:
          SHIGUANG_DATA: /tmp/shiguang-smoke
          SHIGUANG_EMBED_BACKEND: demo
          SHIGUANG_ENABLE_OCR: "false"
          SHIGUANG_ENABLE_FACES: "false"
        run: >-
          python -c "from fastapi.testclient import TestClient;
          from shiguang.api import create_app;
          app=create_app();
          c=TestClient(app);
          assert c.get('/livez').status_code == 200;
          assert c.get('/readyz').status_code == 200"
      - name: Compile check
        run: python -m compileall -q shiguang scripts eval run.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t shiguang:ci .

  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shiguang
          POSTGRES_PASSWORD: shiguang
          POSTGRES_DB: shiguang_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiguang -d shiguang_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SHIGUANG_TEST_PG_DSN: postgresql://shiguang:shiguang@127.0.0.1:5432/shiguang_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-enterprise.txt pytest
      - run: pytest tests/test_pgvector_integration.py -q
