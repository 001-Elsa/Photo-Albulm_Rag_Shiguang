name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: >
          coverage run -m pytest tests/ -q
          --ignore=tests/test_enterprise_stack_integration.py
          --ignore=tests/test_pgvector_integration.py
          && coverage xml
          && coverage report
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Ruff
        run: ruff check shiguang eval scripts tests run.py
      - name: Mypy
        run: mypy shiguang --ignore-missing-imports
      - name: API smoke test
        env:
          SHIGUANG_DATA: /tmp/shiguang-smoke
          SHIGUANG_EMBED_BACKEND: demo
          SHIGUANG_ENABLE_OCR: "false"
          SHIGUANG_ENABLE_FACES: "false"
        run: >-
          python -c "from fastapi.testclient import TestClient;
          from shiguang.api import create_app;
          app=create_app();
          c=TestClient(app);
          assert c.get('/livez').status_code == 200;
          assert c.get('/readyz').status_code == 200"
      - name: Compile check
        run: python -m compileall -q shiguang scripts eval run.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t shiguang:ci .

  pgvector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shiguang
          POSTGRES_PASSWORD: shiguang
          POSTGRES_DB: shiguang_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiguang -d shiguang_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SHIGUANG_TEST_PG_DSN: postgresql://shiguang:shiguang@127.0.0.1:5432/shiguang_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-enterprise.txt pytest
      - run: pytest tests/test_pgvector_integration.py -q

  enterprise-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shiguang_admin
          POSTGRES_PASSWORD: shiguang_admin
          POSTGRES_DB: shiguang_enterprise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiguang_admin -d shiguang_enterprise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SHIGUANG_TEST_ENTERPRISE_PG_ADMIN_DSN: postgresql://shiguang_admin:shiguang_admin@127.0.0.1:5432/shiguang_enterprise
      SHIGUANG_TEST_ENTERPRISE_PG_DSN: postgresql://shiguang_app:shiguang_app@127.0.0.1:5432/shiguang_enterprise
      SHIGUANG_TEST_ENTERPRISE_PG_APP_USER: shiguang_app
      SHIGUANG_TEST_ENTERPRISE_PG_APP_PASSWORD: shiguang_app
      SHIGUANG_TEST_ENTERPRISE_REDIS_URL: redis://127.0.0.1:6379/0
      SHIGUANG_TEST_ENTERPRISE_MINIO_ENDPOINT: 127.0.0.1:9000
      SHIGUANG_TEST_ENTERPRISE_MINIO_ACCESS_KEY: shiguang
      SHIGUANG_TEST_ENTERPRISE_MINIO_SECRET_KEY: shiguang-minio-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Start MinIO
        run: |
          docker run -d --name minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=shiguang \
            -e MINIO_ROOT_PASSWORD=shiguang-minio-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z \
            server /data --console-address ":9001"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          exit 1
      - run: pip install -r requirements-enterprise.txt pytest
      - run: pytest tests/test_enterprise_stack_integration.py -q

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements-core.txt
          pip-audit -r requirements-enterprise.txt
          pip-audit -r requirements-dev.txt
