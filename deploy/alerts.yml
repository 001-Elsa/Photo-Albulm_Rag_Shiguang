groups:
  - name: shiguang
    rules:
      - alert: ShiguangHighErrorRate
        expr: |
          sum(rate(shiguang_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(shiguang_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "拾光 API 五分钟错误率超过 5%"

      - alert: ShiguangSearchP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(shiguang_search_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "拾光搜索 P95 延迟超过 1 秒"

      - alert: ShiguangQueueBacklog
        expr: shiguang_job_queue_depth > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "拾光任务队列积压超过 1000"

      - alert: ShiguangJobFailureRate
        expr: |
          shiguang_jobs{status="failed"}
          /
          clamp_min(sum(shiguang_jobs), 1) > 0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "拾光任务失败率超过 2%"
