<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光 · 本地相册第二大脑</title>
<style>
  :root {
    --bg: #101214; --panel: #191c1f; --line: #2a2e33;
    --text: #e8eaed; --muted: #9aa0a6; --accent: #4f8cff;
    --danger: #ff6b6b; --success: #4ecb71;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(16,18,20,.92);
           backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
           padding: 14px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: 2px; }
  h1 span { color: var(--accent); }
  .searchbox { flex: 1; min-width: 260px; display: flex; gap: 8px; }
  .searchbox input { flex: 1; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 15px; outline: none; }
  .searchbox input:focus { border-color: var(--accent); }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 10px;
           padding: 10px 18px; font-size: 14px; cursor: pointer; transition: filter .15s; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
  nav { display: flex; gap: 6px; }
  nav button.active { background: var(--panel); color: var(--accent); border: 1px solid var(--accent); }
  main { padding: 18px 20px; max-width: 1500px; margin: 0 auto; }
  .meta { color: var(--muted); font-size: 13px; margin: 4px 0 14px; min-height: 18px; }
  .meta code { color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border-radius: 10px; overflow: hidden; cursor: pointer;
          border: 1px solid var(--line); transition: transform .12s; }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #000; }
  .card .cap { padding: 7px 9px; font-size: 12px; color: var(--muted);
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 5px;
         background: #2b3a55; color: #8ab4ff; margin-right: 5px; }
  .empty { color: var(--muted); text-align: center; padding: 70px 0; font-size: 15px; line-height: 2; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
           color: var(--text); max-width: 86vw; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.75); }
  dialog img { max-width: 84vw; max-height: 74vh; display: block; }
  dialog .info { padding: 12px 16px; font-size: 13px; color: var(--muted); max-width: 84vw; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .settings { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
              padding: 18px; max-width: 720px; }
  .settings textarea { width: 100%; height: 90px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 14px; }
  .settings .row { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line);
          padding: 3px 10px; border-radius: 99px; }
  .person { text-align: center; }
  .person input { width: 90%; margin: 6px 0; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px; font-size: 13px; text-align: center; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.7; }

  /* ====== 认证页面 ====== */
  .auth-page { display: flex; align-items: center; justify-content: center;
               min-height: 100vh; padding: 20px; }
  .auth-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
               padding: 36px 32px; width: 100%; max-width: 400px; }
  .auth-card .brand { text-align: center; margin-bottom: 28px; }
  .auth-card .brand h1 { font-size: 26px; letter-spacing: 4px; }
  .auth-card .brand p { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .auth-tabs { display: flex; gap: 0; margin-bottom: 24px; border-radius: 10px;
               background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
  .auth-tabs button { flex: 1; background: transparent; color: var(--muted);
    border: none; border-radius: 0; padding: 11px; font-size: 14px; cursor: pointer; transition: all .2s; }
  .auth-tabs button.active { background: var(--accent); color: #fff; }
  .auth-form { display: flex; flex-direction: column; gap: 14px; }
  .auth-form label { font-size: 13px; color: var(--muted); }
  .auth-form input { width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px;
    font-size: 15px; outline: none; transition: border-color .2s; }
  .auth-form input:focus { border-color: var(--accent); }
  .auth-form .err { color: var(--danger); font-size: 13px; min-height: 18px; line-height: 1.5; }
  .auth-form .ok { color: var(--success); font-size: 13px; min-height: 18px; line-height: 1.5; }
  .auth-form button[type=submit] { width: 100%; padding: 12px; font-size: 15px; font-weight: 500; }
  .auth-form .divider { display: flex; align-items: center; gap: 12px; color: var(--muted);
                         font-size: 12px; margin: 4px 0; }
  .auth-form .divider::before, .auth-form .divider::after { content: ''; flex: 1;
    height: 1px; background: var(--line); }
  .auth-form .switch-text { text-align: center; font-size: 13px; color: var(--muted); }
  .auth-form .switch-text button { background: none; border: none; color: var(--accent);
    font-size: 13px; cursor: pointer; padding: 2px 4px; text-decoration: underline; }
  .auth-form .switch-text button:hover { filter: brightness(1.2); }

  .user-bar { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .user-bar .uname { font-size: 13px; color: var(--accent); }
</style>
</head>
<body>

<!-- ====== 认证页面 ====== -->
<div id="auth-page" class="auth-page" style="display:none">
  <div class="auth-card">
    <div class="brand">
      <h1>拾<span>光</span></h1>
      <p>本地相册第二大脑 · 数据全程离线</p>
    </div>
    <div class="auth-tabs" id="auth-tabs">
      <button id="tab-login-btn" class="active">登录</button>
      <button id="tab-register-btn">注册</button>
    </div>

    <!-- 登录表单 -->
    <form id="login-form" class="auth-form" onsubmit="return false">
      <div>
        <input id="login-user" type="text" placeholder="用户名" autocomplete="username" required>
      </div>
      <div>
        <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password" required>
      </div>
      <div class="err" id="login-err"></div>
      <button type="submit" onclick="doLogin()">登 录</button>
      <div class="switch-text">
        还没有账号？
        <button type="button" onclick="switchAuthTab('register')">立即注册</button>
      </div>
    </form>

    <!-- 注册表单 -->
    <form id="register-form" class="auth-form" style="display:none" onsubmit="return false">
      <div>
        <input id="reg-user" type="text" placeholder="用户名（字母数字下划线，2-32位）"
               autocomplete="username" required>
      </div>
      <div>
        <input id="reg-pass" type="password" placeholder="密码（至少 8 位）"
               autocomplete="new-password" required>
      </div>
      <div>
        <input id="reg-pass2" type="password" placeholder="确认密码" required>
      </div>
      <div class="err" id="reg-err"></div>
      <div class="ok" id="reg-ok"></div>
      <button type="submit" onclick="doRegister()">注 册</button>
      <div class="switch-text">
        已有账号？
        <button type="button" onclick="switchAuthTab('login')">去登录</button>
      </div>
    </form>
  </div>
</div>

<!-- ====== 主应用 ====== -->
<div id="app-page" style="display:none">
<header>
  <h1>拾<span>光</span></h1>
  <div class="searchbox">
    <input id="q" placeholder='试试:"去年在海边拍的日落"、"高铁票 截图"、"和妈妈的合影"…'
           autocomplete="off">
    <button onclick="doSearch()">搜索</button>
  </div>
  <nav>
    <button class="ghost" id="tab-search" onclick="showTab('search')">检索</button>
    <button class="ghost" id="tab-persons" onclick="showTab('persons')">人物</button>
    <button class="ghost" id="tab-dupes" onclick="showTab('dupes')">去重</button>
    <button class="ghost" id="tab-settings" onclick="showTab('settings')">设置</button>
  </nav>
  <div class="user-bar">
    <span class="uname" id="current-user"></span>
    <button class="ghost" onclick="doLogout()" style="font-size:12px;padding:6px 12px">退出</button>
  </div>
</header>
<main>
  <div class="meta" id="meta"></div>
  <div id="view"></div>
</main>
</div>

<!-- 相册查看器 -->
<dialog id="viewer">
  <img id="viewer-img">
  <div class="info" id="viewer-info"></div>
  <div style="padding:0 16px 14px"><button id="btn-similar">找相似照片</button></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
let currentTab = 'search';
let me = null;

/* ====== 认证页面切换 ====== */
function switchAuthTab(tab) {
  const isLogin = tab === 'login';
  $('#tab-login-btn').classList.toggle('active', isLogin);
  $('#tab-register-btn').classList.toggle('active', !isLogin);
  $('#login-form').style.display = isLogin ? '' : 'none';
  $('#register-form').style.display = isLogin ? 'none' : '';
  $('#login-err').textContent = '';
  $('#reg-err').textContent = '';
  $('#reg-ok').textContent = '';
}
$('#tab-login-btn').addEventListener('click', () => switchAuthTab('login'));
$('#tab-register-btn').addEventListener('click', () => switchAuthTab('register'));

/* ====== 页面显示切换 ====== */
function showAuthPage() {
  $('#auth-page').style.display = '';
  $('#app-page').style.display = 'none';
  me = null;
}

function showAppPage() {
  $('#auth-page').style.display = 'none';
  $('#app-page').style.display = '';
  $('#current-user').textContent = me ? me.username : '';
}

/* ====== API 封装 ====== */
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 401) {
    showAuthPage();
    throw new Error('未登录');
  }
  return r;
}

/* ====== 登录 ====== */
async function doLogin() {
  $('#login-err').textContent = '';
  const btn = $('#login-form').querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = '登录中…';

  const username = $('#login-user').value.trim();
  const password = $('#login-pass').value;
  if (!username || !password) {
    $('#login-err').textContent = '请填写用户名和密码';
    btn.disabled = false; btn.textContent = '登 录';
    return;
  }

  try {
    const r = await fetch('/api/login', { method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username, password }) });
    const data = await r.json();
    if (!r.ok) {
      $('#login-err').textContent = data.detail || '登录失败';
      btn.disabled = false; btn.textContent = '登 录';
      return;
    }
    me = { username: data.username, role: data.role };
    showAppPage();
    showTab('search');
  } catch (e) {
    $('#login-err').textContent = '网络错误,请重试';
    btn.disabled = false; btn.textContent = '登 录';
  }
}

/* ====== 注册 ====== */
async function doRegister() {
  $('#reg-err').textContent = '';
  $('#reg-ok').textContent = '';
  const btn = $('#register-form').querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = '注册中…';

  const username = $('#reg-user').value.trim();
  const password = $('#reg-pass').value;
  const password2 = $('#reg-pass2').value;

  if (!username || !password || !password2) {
    $('#reg-err').textContent = '请填写所有字段';
    btn.disabled = false; btn.textContent = '注 册';
    return;
  }
  if (username.length < 2 || username.length > 32) {
    $('#reg-err').textContent = '用户名需要 2-32 个字符';
    btn.disabled = false; btn.textContent = '注 册';
    return;
  }
  if (!/^[a-zA-Z0-9_\-一-鿿]+$/.test(username)) {
    $('#reg-err').textContent = '用户名只允许字母、数字、下划线、连字符和中文';
    btn.disabled = false; btn.textContent = '注 册';
    return;
  }
  if (password.length < 8) {
    $('#reg-err').textContent = '密码至少 8 位';
    btn.disabled = false; btn.textContent = '注 册';
    return;
  }
  if (password !== password2) {
    $('#reg-err').textContent = '两次输入的密码不一致';
    btn.disabled = false; btn.textContent = '注 册';
    return;
  }

  try {
    const r = await fetch('/api/register', { method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username, password }) });
    const data = await r.json();
    if (!r.ok) {
      $('#reg-err').textContent = data.detail || '注册失败';
      btn.disabled = false; btn.textContent = '注 册';
      return;
    }
    // 注册成功,自动登录
    $('#reg-ok').textContent = '注册成功,跳转中…';
    setTimeout(() => {
      me = { username: data.username, role: data.role };
      showAppPage();
      showTab('search');
    }, 600);
  } catch (e) {
    $('#reg-err').textContent = '网络错误,请重试';
    btn.disabled = false; btn.textContent = '注 册';
  }
}

/* ====== 退出 ====== */
async function doLogout() {
  await fetch('/api/logout', { method: 'POST' });
  me = null;
  showAuthPage();
  switchAuthTab('login');
}

/* ====== 键盘快捷键 ====== */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const authVisible = $('#auth-page').style.display !== 'none';
    if (authVisible) {
      if ($('#register-form').style.display !== 'none') {
        doRegister();
      } else {
        doLogin();
      }
    }
  }
});

/* ====== 主应用逻辑 ====== */
async function checkAuth() {
  try {
    const r = await fetch('/api/me');
    if (!r.ok) { showAuthPage(); return false; }
    me = await r.json();
    showAppPage();
    return true;
  } catch { showAuthPage(); return false; }
}

function showTab(t) {
  currentTab = t;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  const el = $('#tab-' + t);
  if (el) el.classList.add('active');
  if (t === 'search') renderEmpty();
  if (t === 'persons') loadPersons();
  if (t === 'dupes') loadDupes();
  if (t === 'settings') renderSettings();
}

function renderEmpty() {
  $('#meta').textContent = '';
  $('#view').innerHTML = `<div class="empty">输入自然语言,直接搜你的本地相册<br>
    数据全程离线,一字节不出电脑</div>`;
}

async function doSearch() {
  const q = $('#q').value.trim();
  if (!q) return;
  showTab('search');
  $('#meta').textContent = '检索中…';
  try {
    const r = await api('/api/search?q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const data = await r.json();
    const p = data.parsed;
    const cond = [];
    if (p.year_from) cond.push(`${p.year_from}${p.year_to !== p.year_from ? '~' + p.year_to : ''}年`);
    if (p.months && p.months.length) cond.push(p.months.join('/') + '月');
    if (p.place) cond.push('地点:' + p.place);
    if (p.person) cond.push('人物:' + p.person);
    if (p.screenshot) cond.push('仅截图');
    $('#meta').innerHTML =
      `${data.count} 个结果 · ${data.latency_ms}ms · 语义:<code>${p.semantic || '-'}</code>` +
      (cond.length ? ' · 条件:' + cond.map(c => `<span class="tag">${c}</span>`).join('') : '');
    if (!data.results.length) {
      $('#view').innerHTML = '<div class="empty">没有找到,换个说法试试?</div>';
      return;
    }
    $('#view').innerHTML = '<div class="grid">' + data.results.map(x => `
      <div class="card" onclick="openViewer(${x.id})">
        <img loading="lazy" src="/api/thumb/${x.id}">
        <div class="cap">${(x.taken_at || '').slice(0, 10)}
          ${x.is_screenshot ? '<span class="tag">截图</span>' : ''} ${x.why || ''}</div>
      </div>`).join('') + '</div>';
  } catch (e) {
    $('#meta').textContent = '';
    $('#view').innerHTML = `<div class="empty">检索失败:${e.message}</div>`;
  }
}
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

async function openViewer(id) {
  const info = await (await fetch(`/api/photo/${id}/info`)).json();
  $('#viewer-img').src = '/api/photo/' + id;
  $('#viewer-info').innerHTML =
    `${info.path}<br>${info.taken_at || ''} · ${info.width}×${info.height}` +
    (info.place ? ' · ' + info.place : '') +
    (info.camera ? ' · ' + info.camera : '') +
    (info.ocr ? `<br>图中文字:${info.ocr.slice(0, 160).replace(/\n/g, ' ')}` : '');
  $('#btn-similar').onclick = () => { $('#viewer').close(); showSimilar(id); };
  $('#viewer').showModal();
}

async function showSimilar(id) {
  showTab('search');
  $('#meta').textContent = '找相似中…';
  const data = await (await api(`/api/similar/${id}`)).json();
  $('#meta').textContent = `与所选照片视觉相似的 ${data.count} 张 · ${data.latency_ms}ms`;
  $('#view').innerHTML = '<div class="grid">' + data.results.map(x => `
    <div class="card" onclick="openViewer(${x.id})">
      <img loading="lazy" src="/api/thumb/${x.id}">
      <div class="cap">${(x.taken_at || '').slice(0, 10)} ${x.why || ''}</div>
    </div>`).join('') + '</div>';
}
$('#viewer').addEventListener('click', e => { if (e.target.tagName === 'DIALOG') e.target.close(); });

async function loadPersons() {
  const list = await (await api('/api/persons')).json();
  $('#meta').textContent = list.length ? `${list.length} 个人物(点名字可修改,命名后即可搜"和XX的合影")` : '';
  if (!list.length) {
    $('#view').innerHTML = '<div class="empty">还没有人物簇。完成索引且启用人脸功能后这里会出现人物。</div>';
    return;
  }
  $('#view').innerHTML = '<div class="grid">' + list.map(p => `
    <div class="card person">
      <img loading="lazy" src="/api/thumb/${p.cover_photo}">
      <input value="${p.name || ''}" placeholder="未命名"
             onchange="namePerson(${p.id}, this.value)">
      <div class="cap">${p.n_faces} 张脸</div>
    </div>`).join('') + '</div>';
}
async function namePerson(id, name) {
  await fetch(`/api/persons/${id}/name`, { method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name }) });
}

async function loadDupes() {
  $('#meta').textContent = '分析中…';
  const data = await (await api('/api/dupes')).json();
  $('#meta').textContent = data.total_groups ? `${data.total_groups} 组近似重复` : '';
  if (!data.groups.length) {
    $('#view').innerHTML = '<div class="empty">没有发现近似重复的照片</div>';
    return;
  }
  $('#view').innerHTML = data.groups.map(g => `
    <div style="margin-bottom:18px">
      <div class="pill">1 组 × ${g.length} 张</div>
      <div class="grid" style="margin-top:8px">${g.map(x => `
        <div class="card" onclick="openViewer(${x.id})">
          <img loading="lazy" src="/api/thumb/${x.id}">
          <div class="cap">${(x.size / 1024 / 1024).toFixed(1)}MB · ${(x.taken_at || '').slice(0, 10)}</div>
        </div>`).join('')}</div>
    </div>`).join('');
}

async function renderSettings() {
  const s = await (await api('/api/stats')).json();
  $('#meta').textContent = '';
  $('#view').innerHTML = `
  <div class="settings">
    <b>相册目录</b>(每行一个,保存后自动开启增量监听)
    <textarea id="dirs">${(s.library_dirs || []).join('\n')}</textarea>
    <div class="row">
      <button onclick="saveDirs()">保存目录</button>
      <button class="ghost" onclick="startIndex()">开始/继续索引</button>
      <span class="pill">模型后端:${s.backend}</span>
      <span class="pill">OCR:${s.ocr_available ? '✓' : '✗'}</span>
      <span class="pill">人脸:${s.faces_available ? '✓' : '✗'}</span>
    </div>
    <div class="hint">已索引 ${s.total || 0} 张 · 向量 ${s.embedded || 0} · OCR ${s.ocr_done || 0}
      · 人脸 ${s.faces_done || 0} · 截图 ${s.screenshots || 0}
      ${s.backend === 'demo' ? '<br>⚠️ 当前是 demo 伪向量后端,请安装 torch+transformers 或导出 ONNX 模型以获得真实语义检索' : ''}
    </div>
    <div id="prog"></div>
  </div>`;
}
async function saveDirs() {
  const dirs = $('#dirs').value.split('\n').map(x => x.trim()).filter(Boolean);
  const r = await fetch('/api/settings/dirs', { method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ dirs }) });
  alert(r.ok ? '已保存' : '保存失败:' + (await r.json()).detail);
}
async function startIndex() {
  const r = await fetch('/api/index/start', { method: 'POST' });
  if (!r.ok) { alert((await r.json()).detail); return; }
  const es = new EventSource('/api/index/progress');
  const stageNames = { scan: '扫描', embed: '向量化', ocr: 'OCR', faces: '人脸',
                       cluster: '聚类', done: '完成', error: '出错', idle: '等待' };
  es.onmessage = ev => {
    const p = JSON.parse(ev.data);
    const pct = p.total ? Math.round(p.done / p.total * 100) : 0;
    const el = $('#prog');
    if (el) el.innerHTML = `<div class="hint">${stageNames[p.stage] || p.stage}
      ${p.done}/${p.total} (${pct}%) · ${p.elapsed}s · 失败 ${p.errors}<br>
      <span style="font-size:11px">${p.current || ''}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>`;
    if (p.finished) { es.close(); renderSettings(); }
  };
}

/* ====== 启动 ====== */
checkAuth().then(ok => { if (ok) showTab('search'); });
</script>
</body>
